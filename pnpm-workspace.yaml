packages:
  - "apps/*"
  - "packages/*"
  - "tests"

catalog:
  "@types/node": ^24.19.2
  "@vitest/coverage-v8": ^3.2.7
  eslint: ^9.0.0
  prettier: ^3.0.0
  tsup: ^8.0.0
  typescript: ^5.0.0
  vitest: ^3.2.7

autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
linkWorkspacePackages: true
sharedWorkspaceLockfile: true

allowBuilds:
  "@nestjs/core": true
  "@scarf/scarf": false
  "@swc/core": true
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  sharp: true
  ssh2: false
  unrs-resolver: true
