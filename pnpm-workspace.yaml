packages:
  - "apps/*"
  - "packages/*"
  - "tests"

catalog:
  "@types/node": ^24.0.0
  "@vitest/coverage-v8": ^3.0.0
  eslint: ^9.0.0
  prettier: ^3.0.0
  tsup: ^8.0.0
  typescript: ^5.0.0
  vitest: ^3.2.7

autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
linkWorkspacePackages: true
sharedWorkspaceLockfile: true

allowBuilds:
  "@nestjs/core": true
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  nx: true
  sharp: true
  unrs-resolver: true
