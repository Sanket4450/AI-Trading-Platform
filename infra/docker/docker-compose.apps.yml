include:
  - ./docker-compose.yml

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    env_file: ../../.env
    environment:
      API_URL: http://api:8000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../../.env
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8000:8000'
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: ../../.env
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy
