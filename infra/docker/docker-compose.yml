name: ai-trading-system

# PostgreSQL is external. DATABASE_URL in the workspace .env is the single
# source of truth for the database. This file only starts local Redis.
services:
  redis:
    image: redis/redis-stack:latest
    container_name: ai-trading-redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: '--appendonly yes --maxmemory-policy noeviction'
    ports:
      - '6379:6379'
      - '8001:8001' # RedisInsight GUI
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
