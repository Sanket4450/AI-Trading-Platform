include:
  - ../../docker-compose.yml

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    env_file: ../../.env
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_trading}:${POSTGRES_PASSWORD:-ai_trading}@postgres:5432/${POSTGRES_DB:-ai_trading}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_trading}:${POSTGRES_PASSWORD:-ai_trading}@postgres:5432/${POSTGRES_DB:-ai_trading}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
